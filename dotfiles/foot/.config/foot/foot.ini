# foot — terminal Wayland. Configuration volontairement minimale :
# tout ce qui n'est pas ici reste au défaut de /etc/xdg/foot/foot.ini,
# qui est lu en premier et intégralement commenté (donc valeurs internes).
#
# POURQUOI CE FICHIER EXISTE
# Le défaut de foot est « monospace:size=8 ». Huit points est petit sur des
# écrans à scale=1, ce qui obligeait à un Ctrl++ à chaque ouverture. Le zoom
# de foot n'est pas persistant : il vaut pour la fenêtre en cours, jamais pour
# la suivante. Corriger le défaut est la seule façon d'en finir.
#
# À SAVOIR SUR LA TAILLE
# Les trois écrans sont à scale=1.0 et foot est « dpi-aware=no » par défaut,
# donc il se règle sur l'échelle et non sur la densité réelle. Une même taille
# en points rend donc le même nombre de PIXELS partout — mais le P2725DE
# (2560x1440 en 27") est plus dense que les deux 1080p en 24", le texte y
# paraît donc physiquement ~15 % plus petit. Passer « dpi-aware=yes » ferait
# suivre la densité de chaque écran ; c'est déconseillé sous Wayland, où
# l'échelle du compositeur fait normalement autorité. Laissé au défaut.

[main]
font=monospace:size=11

# Ctrl+plus / Ctrl+moins restent disponibles pour un ajustement ponctuel,
# ils sont liés par défaut. Le pas est de 0.5 point (font-size-adjustment).
