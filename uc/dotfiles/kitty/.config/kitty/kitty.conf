# kitty — terminal du poste de référence.
#
# Ce paquet remplace `foot`, retiré du dépôt et de la machine le 2026-09-09 :
# foot était installé et inutilisé depuis que kitty a pris la place le
# 2026-09-04, et son `foot.ini` ne configurait donc plus rien.

# ── Taille de police : rien à régler, et c'est mesuré ───────────────────────
# Le `foot.ini` n'existait que pour une raison : le défaut de foot est
# `monospace:size=8`, illisible à scale=1, et le zoom de foot n'est pas
# persistant — il vaut pour la fenêtre en cours, jamais pour la suivante.
# Ce problème N'EXISTE PAS dans kitty : son `font_size` par défaut vaut déjà
# 11.0 (`/usr/lib64/kitty/kitty/options/definition.py:52`), soit exactement la
# valeur que le `foot.ini` posait à la main. Il n'y a donc aucune ligne de
# police ici, et c'est un choix, pas un oubli.
#
# ── Ce qui reste ouvert, et qui n'est pas une affaire de terminal ───────────
# Les trois écrans sont à `scale: 1` (`hyprctl monitors`), donc une même taille
# en points rend le même nombre de PIXELS partout. Or le P2725DE (2560x1440 en
# 27") est plus dense que les deux 1080p en 24" : le texte y paraît
# physiquement ~15 % plus petit. C'est une question d'échelle de compositeur,
# pas de terminal — à trancher dans Hyprland si ça devient gênant.

# ── Notifications ───────────────────────────────────────────────────────────
# Claude Code n'émet pas de notification lui-même : il envoie une séquence
# OSC 99 que le TERMINAL transforme en notification D-Bus. D'où un `app_name`
# valant « kitty » dans l'historique Noctalia, et non « Claude Code » —
# chercher l'émetteur du côté de l'application est une impasse.
#
# Mesuré le 2026-09-09 sur les 91 notifications de l'historique Noctalia,
# toutes émises par Claude Code et aucune par autre chose :
#     83  « Claude is waiting for your input »   ← bruit : on regarde l'écran
#      8  « Claude needs your permission »       ← utile : une action attendue
# 38 pour la seule journée du 09, écart médian 8,5 min, 4 écarts sous la
# minute sur 90. Ce n'est pas une rafale mais un fond continu : d'où un filtre
# par contenu, et non une temporisation.
#
# Le filtre agit DANS kitty : la notification n'atteint jamais Noctalia. Il est
# donc inutile de chercher une règle par application côté shell.
#
# L'autre levier serait `preferredNotifChannel: notifications_disabled` dans
# ~/.claude/settings.json — écarté : il est global et emporterait aussi les
# huit demandes de permission, les seules qui servent.
#
# Syntaxe : `champ:regexp` sur `title`, `body`, `app`, `type` ; opérateurs
# booléens acceptés ; la valeur spéciale `all` filtre tout. Référence sur le
# disque : /usr/lib64/kitty/kitty/options/definition.py:2325
filter_notification body:"waiting for your input"
